[workspace]
members = [
    "apps/cursor-zh-launcher",
    "crates/cursor-zh-core",
]
resolver = "3"

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
futures-util = "0.3.34"
hex = "0.4.3"
open = { version = "5.4.1", features = ["shellexecute-on-windows"] }
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
